<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Riva Chinese → English Translator</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>Riva Chinese &rarr; English Translator</h1>
    <p class="subtitle">Speak Chinese into this device's microphone; hear English through its speaker.</p>
  </header>

  <main>
    <section id="duplex-panel">
      <div class="control-row">
        <button id="duplex-start" class="primary">Start</button>
        <button id="duplex-stop" class="secondary" disabled>Stop</button>
        <label class="toggle">
          <input id="mute-output" type="checkbox" />
          <span>Listen only (mute output)</span>
        </label>
        <span id="duplex-status"></span>
      </div>
      <div class="device-row">
        <label for="duplex-input">Microphone</label>
        <select id="duplex-input"><option value="">Default microphone</option></select>
      </div>
      <div class="device-row" id="duplex-output-row">
        <label for="duplex-output">Speaker</label>
        <select id="duplex-output"><option value="">Default speaker</option></select>
      </div>
      <p id="duplex-output-hint" class="hint"></p>
      <div class="level-meter"><div id="duplex-level-bar" class="level-bar"></div></div>
      <div class="transcripts">
        <div>
          <h3>Heard (Chinese)</h3>
          <p id="duplex-partial-source" class="partial"></p>
          <ul id="duplex-final-source"></ul>
        </div>
        <div>
          <h3>Translation (English)</h3>
          <p id="duplex-partial-translation" class="partial"></p>
          <ul id="duplex-translation-list"></ul>
        </div>
      </div>
    </section>

    <section id="status-panel">
      <h3>Status</h3>
      <ul id="status-log"></ul>
    </section>
  </main>

  <footer>
    <p>Powered by <strong>NVIDIA Riva</strong> streaming speech-to-speech translation.</p>
  </footer>

  <script src="/static/app.js" type="module"></script>
</body>
</html>
